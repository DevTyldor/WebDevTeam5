<!doctype html>
<html lang="nl">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Collection - Shelf</title>
        <link rel="stylesheet" href="../Stylesheet/style.css">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <div class="header-inner">
                <h1>GameShelf</h1>
            </div>
        </header>

        <nav>
            <div class="nav-inner">
                <a href="index.html" class="active">Collection</a>
                <a href="../Lending/index.html">Lending</a>
                <a href="../Gamesession/index.html">Game Sessions</a>
                <a href="../Wishlist/index.html">Wishlist</a>
            </div>
        </nav>

        <main>

            <!-- Shelf info -->
            <section>
                <div class="section-title">
                    <h2>Test1</h2>
                    <a href="shelves.html" class="btn btn-secondary">Back to shelves</a>
                </div>

                <div class="card">
                    <p>Desc1</p>
                    <p>Public: Yes</p>
                </div>
            </section>

            <!-- Games on this shelf -->
            <section>
                <div class="section-title">
                    <h2>Games on this shelf</h2>
                </div>

                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Game</th>
                                <th>Status</th>
                                <th>Plays</th>
                                <th>Rating</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Overwatch</td>
                                <td>In progress</td>
                                <td>5</td>
                                <td></td>
                            </tr>
                            <tr>
                                <td>Halo 3</td>
                                <td>Played</td>
                                <td>12</td>
                                <td>4</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Add game to shelf -->
            <section>
                <div class="section-title">
                    <h2>Add game to shelf</h2>
                </div>

                <form class="card" action="/shelf/add-game" method="post">
                    <div class="form-group">
                        <label for="game">Game</label>
                        <select id="game" name="game_id" required>
                            <option value="">-- choose a game from my collection --</option>
                            <option value="1">Halo 3</option>
                            <option value="2">Overwatch</option>
                            <option value="3">Fortnite</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary">Add to Shelf</button>
                </form>
            </section>

        </main>

    </body>
</html>

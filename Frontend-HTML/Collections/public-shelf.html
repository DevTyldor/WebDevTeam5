<!doctype html>
<html lang="nl">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Collection - Public shelf</title>
        <link rel="stylesheet" href="../Stylesheet/style.css">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <div class="header-inner">
                <h1>GameShelf</h1>
            </div>
        </header>

        <nav>
            <div class="nav-inner">
                <a href="index.html" class="active">Collection</a>
                <a href="../Lending/index.html">Lending</a>
                <a href="../Gamesession/index.html">Game Sessions</a>
                <a href="../Wishlist/index.html">Wishlist</a>
            </div>
        </nav>

        <main>

            <!-- Shelf info -->
            <section>
                <div class="section-title">
                    <h2>Test1 - shelf of Lucas</h2>
                    <a href="index.html" class="btn btn-secondary">Back to collection</a>
                </div>

                <div class="card">
                    <p>Desc1</p>
                    <p>Owner: Lucas</p>
                </div>
            </section>

            <!-- Games on this shelf -->
            <section>
                <div class="section-title">
                    <h2>Games on this shelf</h2>
                </div>

                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Game</th>
                                <th>Status</th>
                                <th>Plays</th>
                                <th>Rating</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Overwatch</td>
                                <td>In progress</td>
                                <td>5</td>
                                <td></td>
                            </tr>
                            <tr>
                                <td>Halo 3</td>
                                <td>Played</td>
                                <td>12</td>
                                <td>4</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

        </main>

    </body>
</html>

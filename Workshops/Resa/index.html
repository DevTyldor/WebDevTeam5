```html
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mijn Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            min-height: 100vh;
        }

        header {
            height: 80px;
            background: #222;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 50px;
        }

        header h1 {
            font-size: 28px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 30px;
        }

        main {
            min-height: calc(100vh - 80px);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 50px;
        }

        .content {
            width: 100%;
            max-width: 1200px;

            display: flex;
            align-items: center;
            gap: 60px;
        }

        .text {
            flex: 1;
        }

        .text h2 {
            font-size: 55px;
            margin-bottom: 20px;
            color: #222;
        }

        .text p {
            font-size: 20px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 30px;
        }

        button {
            padding: 15px 30px;
            font-size: 17px;

            border: none;
            border-radius: 8px;

            background: #007bff;
            color: white;

            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .image {
            flex: 1;
        }

        .image img {
            width: 100%;
            height: 450px;
            object-fit: cover;
            border-radius: 15px;
        }

        @media (max-width: 800px) {
            .content {
                flex-direction: column;
            }

            .text h2 {
                font-size: 40px;
            }

            .image img {
                height: 300px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Mijn Website</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">Over</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <div class="content">

            <div class="text">
                <h2>Welkom op mijn website!</h2>

                <p>
                    Hier kun je verder!!
                </p>

                <button>Meer bekijken</button>
            </div>

            <div class="image">
                <img src="https://picsum.photos/800/500" alt="Voorbeeld afbeelding">
            </div>

        </div>
    </main>

</body>
</html>
```

<!DOCTYPE html>
<html lang="en">

<head>
    <title>Session Creation</title>
    <link rel="stylesheet" href="../stylesheet/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <header>
        <div class="header-inner">
            <h1>Signup</h1>
            <p>Sign up for Friday Board Games!</p>
        </div>
    </header>

    <main class="container">
        <section>

            <div class="card card-hover">
                <div class="game-box">
                    <div class="game-icon">🎲</div>
                    <div>
                        <h3>Friday board games</h3>
                        <p><strong>Host:</strong> Alice</p>
                        <p><strong>Date:</strong> Friday 18 September</p>
                        <p><strong>Time:</strong> 19:00</p>
                        <p><strong>Place:</strong> Club room</p>
                    </div>
                </div>
            </div>

            <div class="card card-hover">
                <div class="game-box">
                    <div>
                        <h4>Capacity</h4>
                        <p>4/6 Confirmed</p>
                        <span class="badge approved">2 seats available</span>
                    </div>
                </div>
            </div>

            <div class="card card-hover">
                <div class="game-box">
                    <div class="game-icon">🎲</div>
                    <div>
                        <h3>Bring a game</h3>
                        <select name="game" id="game">
                            <option value="catan">catan</option>
                            <option value="gloomhaven">Gloomhaven</option>>
                        </select>
                    </div>
                </div>
            </div>
        </section>

        <div class="flex gap-sm">
            <a href="edit-session.html" class="btn btn-primary">Signup</a>
            <a href="session-friday.html" class="btn btn-danger">Cancel signup</a>
        </div>
    </main>
</body>


</html>

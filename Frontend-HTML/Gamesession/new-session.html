<!DOCTYPE html>
<html lang="en">

<head>
    <title>Create Session</title>
    <link rel="stylesheet" href="../stylesheet/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <header>
        <div class="header-inner">
            <h1>New Session</h1>
            <p>Create a new game session!</p>
        </div>
    </header>

    <main class="container">
        <section>
            <div class="card card-hover">
                <div class="game-box">
                    <div class="game-icon">🎲</div>
                    <div>
                        <h3><input type="text" id="nameInput" placeholder="Enter session name"></input></h3>
                        <p><strong>Enter date:</strong><input type="date" id="dateInput"></input></p>
                        <p><strong>Enter time:</strong></p>
                        <p><input type="time" id="timeInput"></input></p>
                        <p><strong>Enter place:</strong></p>
                        <select name="game" id="gameInput">
                            <option value="club">Club room</option>
                            <option value="home">Home</option>>
                        </select>
                        <p><strong>Enter capacity:</strong></p>
                        <p><input type="number" id="capacityInput"></input></p>
                    </div>
                </div>
            </div>
        </section>

        <div class="flex gap-sm">
            <a href="sessions.html" class="btn btn-primary">Create session</a>
            <a href="sessions.html" class="btn btn-danger">Cancel</a>
        </div>

    </main>
</body>


</html>
